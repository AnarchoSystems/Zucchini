types:
  - name: User
    kind: struct
    fields:
      - name: name
        type: string
steps:
  - group:
      tags: [UserWorkflow]
      steps:
        - group:
            tags: [IntroducesUser]
            steps:
              - step: ^users are introduced$
                methodName: introduceUsers
                tags: [Batch]
                dataTable:
                  type: User
  - group:
      tags: [ReferencesUser]
      steps:
        - step: ^user "([^"]*)" is referenced$
          methodName: referenceUser
          arguments:
            - name: name
              type: string