types:
  - name: Color
    kind: enum
    prefix: Color_
    cases:
      - red
      - blue
  - name: Person
    kind: struct
    fields:
      - name: Name
        type: string
      - name: Age
        type: int
      - name: Color
        type: Color
      - name: Tag
        type: list
        content: Color
        separator: ";"
      - name: Nickname
        type: string
        optional: true

steps:
  - step: ^people exist$
    methodName: peopleExist
    dataTable:
      header: true
      type: Person
  - step: ^there are (\d+) people$
    methodName: peopleCount
    arguments:
      - name: Expected
        type: int
