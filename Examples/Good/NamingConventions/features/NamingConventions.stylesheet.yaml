hooks:
  aroundStep: camelCase
  validateScenario: camelCase

snippets:
  methods: camelCase
  classes: CamelCase

cppConventions:
  types:
    blocks:
      - blockName: typePrefix
        onEnum: E
        onStruct: t
    nameIt: [typePrefix, typeName]

  methods:
    nameIt: [methodName]

  variables:
    blocks:
      - blockName: kindPrefix
        onInt: n
        onEnum: e
        onString: s
      - blockName: memberPrefix
        onMember: m
      - blockName: arrayPrefix
        onArray: a
      - blockName: optionalPrefix
        onOptional: opt_
    nameIt:
      [memberPrefix, arrayPrefix, optionalPrefix, kindPrefix, variableName]
