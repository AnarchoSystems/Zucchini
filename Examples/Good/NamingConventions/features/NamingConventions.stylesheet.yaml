cppConventions:
  types:
    casing: PascalCase
    blocks:
      - blockName: typePrefix
        onEnum: E
        onStruct: t
    nameIt: [typePrefix, typeName]

  methods:
    casing: camelCase
    blocks:
      - blockName: stepPrefix
        onStepDefinition: step_
      - blockName: hookPrefix
        onHook: hook_
    nameIt: [stepPrefix, hookPrefix, methodName]

  variables:
    casing: PascalCase
    mapBaseNameIsSingular: true
    blocks:
      - blockName: kindPrefix
        onInt: n
        onEnum: e
        onString: s
      - blockName: memberPrefix
        onMember: m
      - blockName: arrayPrefix
        onArray: a
      - blockName: mapPrefix
        onMap: a
        onNotMap: ""
      - blockName: optionalPrefix
        onOptional: opt_
      - blockName: mapKeyType
        onMapKeyType: kindPrefix
      - blockName: mapValueType
        onMapValueType: kindPrefix
    nameIt:
      [memberPrefix, arrayPrefix, mapPrefix, optionalPrefix, kindPrefix, mapKeyType,
       mapValueType, variableName]
