types:
  - name: Note
    kind: struct
    fields:
      - name: title
      - name: priority
        type: int
        default: 0
steps:
  - step: ^I note$
    methodName: note
    docstring: true
  - step: ^I note this json$
    methodName: noteJson
    docstring:
      contentType: json
      type: Note
  - step: ^I note this yaml$
    methodName: noteYaml
    docstring:
      contentType: yaml
      type: Note
  - step: ^the note is "([^"]*)"$
    methodName: noteIs
    arguments:
      - name: expected
        type: string
  - step: ^the priority is (-?\d+)$
    methodName: priorityIs
    arguments:
      - name: expected
        type: int
