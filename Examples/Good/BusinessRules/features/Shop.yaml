# Each tag names one fact a step states, and has exactly one extractor in
# ShopFacts.h. Tag a step with what it states, not with the rules that read it:
# adding a step under an existing tag only touches that tag's extractor, and
# the rules, which consume facts, stay untouched.
steps:
  - group:
      tags: [Setup]
      steps:
        - step: ^my wallet has (\d+) credits$
          methodName: walletHas
          arguments:
            - name: value
              type: int
        - step: ^the shop has (\d+) items$
          methodName: stockHas
          arguments:
            - name: value
              type: int
        - step: ^each item costs (\d+) credits$
          methodName: itemCosts
          arguments:
            - name: value
              type: int
  - group:
      tags: [Transaction]
      steps:
        - step: ^I buy (\d+) items$
          methodName: buy
          arguments:
            - name: quantity
              type: int
        - step: ^I refund the purchase$
          methodName: refund
  - group:
      tags: [Outcome]
      steps:
        - step: ^the purchase is accepted$
          methodName: purchaseAccepted
        - step: ^the purchase is rejected$
          methodName: purchaseRejected
  - group:
      tags: [Observation]
      steps:
        - step: ^my wallet balance is (\d+) credits$
          methodName: balanceIs
          arguments:
            - name: value
              type: int
        - step: ^the remaining stock is (\d+)$
          methodName: stockIs
          arguments:
            - name: value
              type: int
