types:
  - name: Person
    kind: struct
    fields:
      - name: name
      - name: age
        type: int
      - name: nickname
        optional: true

  - name: Aliases
    kind: struct
    fields:
      - {name: names, type: list}
      - {name: optionalNames, type: list, optional: true}
steps:
  - step: ^I add person "([^"]*)" aged (\d+)$
    methodName: addPerson
    arguments:
      - name: name
        type: string
      - name: age
        type: int
  - step: ^these people exist$
    methodName: peopleExist
    dataTable:
      header: true
      type: Person
  - step: ^the last name is "([^"]*)"$
    methodName: lastNameIs
    arguments:
      - name: expected
        type: string
  - step: ^the person count is (\d+)$
    methodName: personCountIs
    arguments:
      - name: expected
        type: int
  - step: ^these optional nicknames are absent$
    methodName: absentNicknames
    dataTable: {type: Person}
  - step: ^these custom string lists are decoded$
    methodName: aliases
    dataTable: {type: Aliases}
  - step: ^these custom string lists are decoded from json$
    methodName: jsonAliases
    docstring: {type: Aliases, contentType: json}
