includes:
  - "Tables.h"

types:
  - name: Entry
    kind: struct
    imported: true
    verbatimType: nTables::Entry
    fields:
      - name: value
        type: int
        header:
          - value
          - amount
      - name: label
        optional: true
        header:
          - label
          - name
      - name: scale
        type: int
        default: 1
        header:
          - scale
          - multiplier

  - name: LooseEntry
    kind: struct
    imported: true
    verbatimType: nTables::LooseEntry
    additionalProperties: true
    fields:
      - name: value
        type: int

steps:
  - step: ^I add these entries$
    methodName: addEntries
    dataTable:
      header: true
      type: Entry
  - step: ^I add these entries by column$
    methodName: addEntriesByColumn
    dataTable:
      direction: columns
      header: true
      type: Entry
  - step: ^I add these positional entries$
    methodName: addPositionalEntries
    dataTable:
      type: Entry
  - step: ^I add these loose entries$
    methodName: addLooseEntries
    dataTable:
      header: true
      type: LooseEntry
  - step: ^the total is (-?\d+)$
    methodName: totalIs
    arguments:
      - name: value
        type: int
  - step: ^the note is "([^"]*)"$
    methodName: noteIs
    arguments:
      - name: expected
        type: string
