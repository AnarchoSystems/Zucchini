includes:
  - <numeric>

types:
  - name: Entry
    kind: struct
    fields:
      - name: value
        type: int
      - name: label
        optional: true
      - name: scale
        type: int
        default: 1

  - name: LooseEntry
    kind: struct
    additionalProperties: true
    fields:
      - name: value
        type: int

steps:
  - step: ^I start with (-?\d+)$
    methodName: startWith
    arguments:
      - name: value
        type: int

  - step: ^I add (-?\d+)$
    methodName: add
    arguments:
      - name: value
        type: int

  - step: ^I add these numbers$
    methodName: addAll
    dataTable:
      header: true
      type: dynamic

  - step: ^I add these entries$
    methodName: addEntries
    dataTable:
      header: true
      type: Entry

  - step: ^I add these entries by column$
    methodName: addEntriesByColumn
    dataTable:
      direction: columns
      header: true
      type: Entry

  - step: ^I add these positional entries$
    methodName: addPositionalEntries
    dataTable:
      type: Entry

  - step: ^I add these loose entries$
    methodName: addLooseEntries
    dataTable:
      header: true
      type: LooseEntry

  - step: ^I add these raw numbers$
    methodName: addRawNumbers
    dataTable:
      type: dynamic

  - step: ^I note$
    methodName: note
    docstring: true

  - step: ^the result is (-?\d+)$
    methodName: resultIs
    arguments:
      - name: value
        type: int

  - step: ^the note is "([^"]*)"$
    methodName: noteIs
    arguments:
      - name: expected
        type: string
